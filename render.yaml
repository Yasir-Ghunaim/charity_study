# Render Blueprint: the study API on Render's free plan.
# Participant data lives in Postgres (DATABASE_URL, e.g. Neon); the campaign
# catalogue is rebuilt from the seed at every start, so the free plan's
# ephemeral disk loses nothing. See DEPLOY.md.
services:
  - type: web
    name: giving-study-api
    runtime: python
    plan: free
    region: frankfurt             # next to the Neon database (eu-central-1)
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DATABASE_URL          # Neon connection string (required: without it data is lost on restart)
        sync: false
      - key: OPENAI_API_KEY        # ChatGPT, for studies that use the assistant (no local models on Render)
        sync: false
      - key: OPENAI_MODEL          # the model name from your OpenAI dashboard
        sync: false
      - key: AGENT_PROVIDER        # same engine for every participant
        value: openai
      - key: STUDY_ADMIN_TOKEN     # generated by Render; copy it from the dashboard to use /admin
        generateValue: true
      - key: STUDY_CONTACT_AR      # shown in the consent form
        sync: false
      - key: STUDY_CONTACT_EN
        sync: false
